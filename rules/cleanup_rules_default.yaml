exclude_repo: ""

cleanup_defaults:
  keep_latest: 10
  remove_older: 14

unmatched_defaults:
  keep_latest: 10
  remove_older: 14

cleanup_rules:
  logistics_release_app:
    regexp: logistics-service\:.*-release-.*-app-.*
    keep_latest: 10
    remove_older: 14
  logistics_review:
    regexp: logistics-service\:.*-review-.*
    keep_latest: 1
    remove_older: 14
  all_release:
    regexp: .*\:.*-release-.*
    keep_latest: 5
    remove_older: 14
  all_review:
    regexp: .*\:.*-review-.*
    keep_latest: 2
    remove_older: 14
  # Example: save_regexps splits matched images into saved/non_saved groups.
  # Both groups independently follow keep_latest and remove_older.
  # This guarantees saved images get their own keep_latest allocation.
  # example_rule:
  #   regexp: gf-stock\/app\:.*
  #   keep_latest: 1
  #   remove_older: 2
  #   save_regexps:
  #     - "review-clusters-.+"
