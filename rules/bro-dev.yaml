cleanup_defaults: # default лимиты для matched образов.
  keep_latest: 5
  remove_older: 7

unmatched_defaults: # default лимиты для unmatched образов.
  keep_latest: 5
  remove_older: 7

exclude_repo: "images/.*"

cleanup_rules:
  review:
    regexp: .*\:review-.*
    keep_latest: 20
    remove_older: 30
